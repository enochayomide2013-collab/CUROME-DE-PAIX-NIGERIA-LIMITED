<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 400" width="100%" height="100%">
  <defs>
    <linearGradient id="cGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F97316" />
      <stop offset="60%" stop-color="#EA580C" />
      <stop offset="100%" stop-color="#DC2626" />
    </linearGradient>
    <linearGradient id="pGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="50%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>
    <linearGradient id="flameGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#DC2626" />
      <stop offset="40%" stop-color="#EA580C" />
      <stop offset="85%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#FEF08A" />
    </linearGradient>
    <linearGradient id="innerFlame" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#EF4444" />
      <stop offset="60%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#FFFFFF" />
    </linearGradient>
    <filter id="subtleShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-opacity="0.12" />
    </filter>
  </defs>

  <!-- Group: Main CPD Icon Graphic -->
  <g transform="translate(100, 30)">
    <!-- Letter C (Left Arced Swirl) -->
    <path d="M 120 40 C 40 40 10 90 10 160 C 10 230 45 270 120 270 C 145 270 165 260 178 248 C 140 240 110 215 105 180 C 135 180 155 170 168 150 C 130 150 75 140 75 95 C 75 65 95 48 120 40 Z" 
          fill="url(#cGrad)" />
    
    <!-- Outer flame / junction curve -->
    <path d="M 85 45 C 50 65 35 105 35 155 C 35 205 55 245 95 260 C 50 240 25 195 25 155 C 25 105 55 60 95 45 Z" 
          fill="#FB923C" opacity="0.8" />

    <!-- Letter P (Right Royal Blue Bold Form) -->
    <path d="M 180 40 L 290 40 C 340 40 375 75 375 125 C 375 175 340 210 290 210 L 245 210 L 245 270 L 180 270 Z 
             M 245 95 L 285 95 C 305 95 320 108 320 125 C 320 142 305 155 285 155 L 245 155 Z" 
          fill="url(#pGrad)" />

    <!-- Center Torch Flame Graphic rising between C and P -->
    <path d="M 175 250 C 150 230 140 190 155 155 C 160 142 170 130 172 110 C 174 95 170 75 160 60 C 180 75 195 100 195 125 C 195 138 190 150 195 162 C 200 175 212 188 215 205 C 220 230 200 255 175 250 Z" 
          fill="url(#flameGrad)" />

    <!-- Inner Bright Core of Flame -->
    <path d="M 175 235 C 162 220 158 195 166 175 C 170 166 178 158 178 145 C 182 158 188 170 188 185 C 188 195 184 205 186 215 C 188 226 182 235 175 235 Z" 
          fill="url(#innerFlame)" />
  </g>

  <!-- Typography: ENERGY -->
  <text x="250" y="325" 
        font-family="system-ui, -apple-system, sans-serif" 
        font-weight="900" 
        font-size="44" 
        letter-spacing="2" 
        fill="#0F172A" 
        text-anchor="middle">
    ENERGY
  </text>

  <!-- Divider Rule / Accent line -->
  <line x1="40" y1="345" x2="460" y2="345" stroke="#E2E8F0" stroke-width="1.5" />

  <!-- Subtitle: CUROME DE PAIX ENERGY NIGERIA LIMITED -->
  <text x="250" y="375" 
        font-family="system-ui, -apple-system, sans-serif" 
        font-weight="700" 
        font-size="14.5" 
        letter-spacing="1.5" 
        fill="#1E293B" 
        text-anchor="middle">
    CUROME DE PAIX ENERGY NIGERIA LIMITED
  </text>
</svg>
